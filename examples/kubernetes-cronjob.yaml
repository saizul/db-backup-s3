# Run one backup per CronJob invocation (SCHEDULE is left empty, so the container
# backs up once and exits with 0 on success or 1 on failure).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: backup
              image: ghcr.io/saizul/db-backup-s3:0.1
              args: ["backup"]
              env:
                - { name: DB_ENGINE, value: postgres }
                - { name: DB_HOST, value: postgres.default.svc.cluster.local }
                - { name: DB_USER, value: backup }
                - { name: DB_NAMES, value: app }
                - { name: S3_BUCKET, value: my-db-backups }
                - { name: S3_ENDPOINT_URL, value: "https://<ACCOUNT_ID>.r2.cloudflarestorage.com" }
                - { name: S3_REGION, value: auto }
                - { name: ENCRYPTION, value: age }
                - { name: AGE_RECIPIENTS, value: "age1replace-with-your-public-key" }
                - { name: RETENTION_KEEP_DAILY, value: "7" }
                - { name: RETENTION_KEEP_WEEKLY, value: "4" }
                - { name: RETENTION_KEEP_MONTHLY, value: "6" }
                - { name: DB_PASSWORD_FILE, value: /secrets/db-password }
                - { name: S3_ACCESS_KEY_ID_FILE, value: /secrets/s3-access-key-id }
                - { name: S3_SECRET_ACCESS_KEY_FILE, value: /secrets/s3-secret-access-key }
                - { name: HEALTHCHECK_URL_FILE, value: /secrets/healthcheck-url }
              volumeMounts:
                - { name: secrets, mountPath: /secrets, readOnly: true }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: secrets
              secret:
                secretName: db-backup
