[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "db-backup-s3"
dynamic = ["version"]
description = "Scheduled MySQL/MariaDB and PostgreSQL backups to any S3-compatible storage (AWS S3, Cloudflare R2, Backblaze B2, MinIO) with gzip, age/AES encryption, retention, healthcheck pings and one-command restore."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Saizul Amin" }]
keywords = ["backup", "mysql", "mariadb", "postgresql", "s3", "cloudflare-r2", "backblaze-b2", "minio", "docker", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["boto3>=1.36", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "moto[s3]>=5.0"]

[project.urls]
Homepage = "https://github.com/saizul/db-backup-s3"
Issues = "https://github.com/saizul/db-backup-s3/issues"
Changelog = "https://github.com/saizul/db-backup-s3/blob/main/CHANGELOG.md"

[project.scripts]
db-backup-s3 = "db_backup_s3.cli:main"

[tool.setuptools.dynamic]
version = { attr = "db_backup_s3._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
db_backup_s3 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
